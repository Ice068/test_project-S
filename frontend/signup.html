<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="styles.css">
<title>Sign Up</title>
</head>

<body class="flex justify-center items-center h-screen bg-gray-100">

<div class="bg-white p-6 rounded shadow w-80">
    <h2 class="text-xl font-bold mb-4 text-center">Sign Up</h2>

    <input id="name" placeholder="ชื่อ" class="w-full mb-3 p-2 border rounded">
    <input id="email" placeholder="Email" class="w-full mb-3 p-2 border rounded">
    <input id="password" type="password" placeholder="Password" class="w-full mb-3 p-2 border rounded">

    <button onclick="signup()" class="w-full bg-pink-500 text-white p-2 rounded">
        สมัครสมาชิก
    </button>
</div>

<script src="js/auth.js"></script>
</body>
</html>
