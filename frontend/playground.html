<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ทดลองโค้ด</title>
  <link rel="stylesheet" href="playground.css">
</head>
<body>

<div class="container">

  <!-- Sidebar -->
  <aside class="sidebar">
    <h2>Dev <span>Sim</span></h2>

    <ul>
      <li><a href="dashboard.html">🏠 หน้าแรก</a></li>
      <li><a href="quests.html">⚔️ ภารกิจ</a></li>
      <li class="active"><a href="playground.html">💻 ทดลองโค้ด</a></li>
      <li><a href="quizzes.html">🏆 แบบทดสอบท้ายบท</a></li>
    </ul>

    <div class="bottom">
      <button onclick="logout()">ออกจากระบบ</button>
    </div>
  </aside>

  <!-- Main -->
  <main class="main">

    <h1>💻 ทดลองเขียนโค้ด</h1>

    <div class="editor-container">

      <!-- Editor -->
      <div class="card editor">
        <h3>HTML Editor</h3>

        <div class="editor-box">
<textarea id="htmlCode"><!DOCTYPE html>
<html>
  <body>
    <h1>Hello World</h1>
    <p>ลองแก้โค้ดดู 🚀</p>
  </body>
</html></textarea>
        </div>

        <button onclick="runCode()">▶ Run Code</button>

        <!-- 🔥 เพิ่มส่วนแสดงผล Quest -->
        <div class="quest-result">
          <p id="status"></p>
          <p id="hint"></p>
        </div>
      </div>

      <!-- Preview -->
      <div class="card preview">
        <h3>Preview</h3>

        <div class="preview-box">
          <iframe id="previewFrame"></iframe>
        </div>
      </div>

    </div>

  </main>

</div>

<script src="playground.js"></script>
</body>
</html>
