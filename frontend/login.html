<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <title>Dev Login</title>
</head>
<body>

  <div class="background"></div>

  <div class="login-card">
    <div class="login">
      <div class="icon">🎮</div>
      <h1>Dev <span>HQ</span></h1>
    </div>

    <!-- Tabs (เหลืออันเดียว) -->
    <div class="tabs">
      <button class="tab-btn active" data-tab="login">Login</button>
      <button class="tab-btn" data-tab="signup">Signup</button>
    </div>

    <!-- Login -->
    <form id="loginForm" class="form active">
      <label>ชื่อผู้ใช้</label>
      <input type="text" id="loginUser">

      <label>รหัสผ่าน</label>
      <input type="password" id="loginPass">

      <button type="submit" class="login-btn">เข้าสู่ระบบ</button>
    </form>

    <!-- Signup -->
    <form id="signupForm" class="form">
      <label>ชื่อผู้ใช้</label>
      <input type="text" id="signupUser">

      <label>รหัสผ่าน</label>
      <input type="password" id="signupPass">

      <label>ยืนยันรหัสผ่าน</label>
      <input type="password" id="signupConfirm">

      <button type="submit" class="login-btn">สมัครสมาชิก</button>
    </form>

  </div>

  <script src="script.js"></script>

</body>
</html>
