<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Results</title>

  <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Mobile Button -->
<button class="mobile-menu-btn" onclick="toggleMenu()">☰</button>

<!-- Sidebar -->
<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div class="logo">📘 Learn HTML</div>
    <button class="close-btn" onclick="toggleMenu()">✕</button>
  </div>

  <div class="nav-menu">
    <a href="index.html" class="nav-link">🏠 หน้าแรก</a>
    <a href="lessons.html" class="nav-link">📘 บทเรียน</a>
    <a href="editor.html" class="nav-link">💻 Editor</a>
    <a href="quiz.html" class="nav-link">📝 Quiz</a>
    <a href="results.html" class="nav-link active">🏆 Results</a>

    <hr>

    <a href="login.html" class="nav-link">🔐 Login</a>
    <a href="signup.html" class="nav-link">📝 Signup</a>
  </div>
</div>

<!-- Main -->
<div class="main-content">
  <div class="container">

    <h1 class="page-title">🏆 ผลคะแนน</h1>
    <p class="page-subtitle">สรุปผลการทำ Quiz</p>

    <!-- Result Card -->
    <div class="card text-center">
      <div class="card-header">
        <h3>คะแนนของคุณ</h3>
      </div>

      <div class="card-body">
        <h1 id="score" class="score-number">0</h1>

        <p id="message"></p>

        <br>

        <a href="quiz.html" class="btn btn-primary">🔄 ทำใหม่</a>
      </div>
    </div>

  </div>
</div>

<!-- JS -->
<script>
function toggleMenu() {
  document.getElementById("sidebar").classList.toggle("active");
}

const score = localStorage.getItem("score") || 0;
document.getElementById("score").innerText = score;

// 🔥 ข้อความตามคะแนน
const message = document.getElementById("message");

if (score >= 1) {
  message.innerHTML = "🎉 เก่งมาก!";
} else {
  message.innerHTML = "💡 ลองใหม่อีกครั้งนะ!";
}
</script>
<script src="main.js"></script>
</body>
</html>
