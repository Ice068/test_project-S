<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz</title>

  <!-- ใช้ CSS ให้ถูก -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Mobile Button -->
<button class="mobile-menu-btn" onclick="toggleMenu()">☰</button>

<!-- Sidebar -->
<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div class="logo">📘 Learn HTML</div>
    <button class="close-btn" onclick="toggleMenu()">✕</button>
  </div>

  <div class="nav-menu">
    <a href="index.html" class="nav-link">🏠 หน้าแรก</a>
    <a href="lessons.html" class="nav-link">📘 บทเรียน</a>
    <a href="editor.html" class="nav-link">💻 Editor</a>
    <a href="quiz.html" class="nav-link active">📝 Quiz</a>
    <a href="results.html" class="nav-link">🏆 Results</a>

    <hr>

    <a href="login.html" class="nav-link">🔐 Login</a>
    <a href="signup.html" class="nav-link">📝 Signup</a>
  </div>
</div>

<!-- Main -->
<div class="main-content">
  <div class="container">

    <h1 class="page-title">📝 Quiz</h1>
    <p class="page-subtitle">ทดสอบความรู้ HTML ของคุณ</p>

    <!-- Quiz Card -->
    <div class="card">
      <div class="card-header">
        <h3>คำถามที่ 1</h3>
      </div>

      <div class="card-body">
        <p>HTML ย่อมาจากอะไร?</p>

        <div class="quiz-options">
          <button class="btn btn-primary" onclick="checkAnswer(true)">
            HyperText Markup Language
          </button>

          <button class="btn btn-secondary" onclick="checkAnswer(false)">
            HighText Machine Language
          </button>
        </div>

        <p id="result" class="result-text"></p>
      </div>
    </div>

  </div>
</div>

<!-- JS -->
<script>
function toggleMenu() {
  document.getElementById("sidebar").classList.toggle("active");
}

function checkAnswer(isCorrect) {
  const result = document.getElementById("result");

  if (isCorrect) {
    result.innerHTML = "✅ ถูกต้อง!";
    result.style.color = "green";
  } else {
    result.innerHTML = "❌ ผิด!";
    result.style.color = "red";
  }
}
</script>
<script src="main.js"></script>
</body>
</html>
